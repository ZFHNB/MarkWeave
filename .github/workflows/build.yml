name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit.xml
          if-no-files-found: ignore

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: markweave-web
          path: dist/
          if-no-files-found: error

  release:
    name: Portable release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        id: build
        shell: pwsh
        run: |
          npm run package:portable
          # 打包脚本把产物放在 released/v<version>/（见 scripts/package.mjs），
          # 不是 electron-builder 的 release/ 中间目录。
          # 版本号用 node 读，避免 PowerShell 的编码差异（5.1 默认 ANSI，
          # package.json 里的中文会被读花导致 ConvertFrom-Json 失败）。
          $version = node -p "require('./package.json').version"
          # 注意用嵌套 Join-Path：PowerShell 5.1 不支持三参数的 Join-Path
          $exe = Join-Path (Join-Path "released" "v$version") "MarkWeave-$version-portable.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Portable executable not found: $exe" }
          $exe = (Resolve-Path -LiteralPath $exe).Path
          "artifact_path=$exe" >> $env:GITHUB_OUTPUT
          "artifact_name=$(Split-Path $exe -Leaf)" >> $env:GITHUB_OUTPUT
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Write checksum
        shell: pwsh
        run: |
          "${{ steps.build.outputs.sha256 }}  ${{ steps.build.outputs.artifact_name }}" |
            Out-File -Encoding ascii -NoNewline "${{ steps.build.outputs.artifact_path }}.sha256"

      - name: Attach artifact to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.build.outputs.artifact_path }}
            ${{ steps.build.outputs.artifact_path }}.sha256
          draft: true
          generate_release_notes: true
