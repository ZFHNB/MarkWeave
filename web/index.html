<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkWeave · 笔记管理器</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #24292f; background: #fff;
        -webkit-font-smoothing: antialiased;
      }
      #app, .wm-shell { height: 100%; display: flex; }

      /* ---------- 侧栏 ---------- */
      .wm-side {
        width: 280px; flex: 0 0 280px;
        display: flex; flex-direction: column;
        border-right: 1px solid #e1e4e8; background: #fafbfc;
      }
      .wm-side-head {
        display: flex; gap: 6px; padding: 12px 12px 8px; flex: 0 0 auto;
      }
      .wm-search {
        flex: 1; min-width: 0; height: 30px; padding: 0 10px;
        border: 1px solid #d0d7de; border-radius: 6px;
        font-size: 13px; background: #fff; outline: none;
      }
      .wm-search:focus { border-color: #0969da; box-shadow: 0 0 0 3px rgba(9,105,218,.1); }
      .wm-new {
        width: 30px; height: 30px; flex: 0 0 auto;
        border: 1px solid #d0d7de; border-radius: 6px;
        background: #fff; font-size: 16px; line-height: 1;
        cursor: pointer; color: #24292f;
      }
      .wm-new:hover { background: #f3f4f6; }

      .wm-tagbar {
        display: flex; flex-wrap: wrap; gap: 4px;
        padding: 0 12px 8px; flex: 0 0 auto;
      }
      .wm-tag {
        border: 1px solid #d0d7de; background: #fff; border-radius: 999px;
        padding: 2px 8px; font-size: 11px; cursor: pointer; color: #57606a;
      }
      .wm-tag.is-active { background: #0969da; border-color: #0969da; color: #fff; }

      .wm-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
      .wm-note {
        display: block; width: 100%; text-align: left;
        border: none; background: transparent; border-radius: 6px;
        padding: 8px 10px; margin-bottom: 2px; cursor: pointer;
        font: inherit; color: inherit; position: relative;
      }
      .wm-note:hover { background: #f3f4f6; }
      .wm-note.is-active { background: #ddf4ff; }
      .wm-note-title {
        display: block; font-size: 13px; font-weight: 600;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        padding-right: 18px;
      }
      .wm-note-meta {
        display: block; font-size: 11px; color: #8b949e; margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .wm-pin { position: absolute; right: 8px; top: 8px; font-size: 10px; }
      .wm-note-tags { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; }
      .wm-note-tag {
        font-size: 10px; color: #0969da; background: #ddf4ff;
        border-radius: 3px; padding: 0 4px; line-height: 15px;
      }
      .wm-empty {
        padding: 28px 12px; text-align: center;
        font-size: 12px; color: #8b949e; line-height: 1.6;
      }
      .wm-side-foot {
        flex: 0 0 auto; padding: 6px 12px;
        border-top: 1px solid #e1e4e8;
        font-size: 11px; color: #8b949e;
      }

      /* ---------- 主区 ---------- */
      .wm-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .wm-bar {
        display: flex; align-items: center; gap: 8px;
        height: 46px; padding: 0 16px; flex: 0 0 auto;
        border-bottom: 1px solid #e1e4e8;
      }
      .wm-title {
        flex: 1; min-width: 0; border: none; outline: none;
        font-size: 12px; font-weight: 500; color: #57606a; background: transparent;
      }
      .wm-title:hover, .wm-title:focus { color: #24292f; }
      .wm-bar-right { display: flex; align-items: center; gap: 6px; }
      .wm-status { font-size: 11px; color: #8b949e; white-space: nowrap; }
      .wm-icon {
        width: 28px; height: 28px; border: 1px solid transparent; border-radius: 6px;
        background: transparent; cursor: pointer; font-size: 13px; line-height: 1;
        color: #57606a;
      }
      .wm-icon:hover { background: #f3f4f6; border-color: #d0d7de; }
      .wm-icon.wm-danger:hover { background: #ffebe9; border-color: #ffcecb; }

      .wm-editor { flex: 1; overflow-y: auto; }
      .wm-editor #mount, .wm-editor .ProseMirror {
        max-width: 760px; margin: 0 auto; padding: 32px 28px 120px; outline: none;
      }

      .wm-foot {
        display: flex; align-items: center; justify-content: space-between;
        height: 26px; padding: 0 16px; flex: 0 0 auto;
        border-top: 1px solid #e1e4e8; background: #fafbfc;
        font-size: 11px; color: #8b949e;
      }
      .wm-hint {
        padding: 1px 8px; border-radius: 999px;
        background: #f3f4f6; border: 1px dashed #d0d7de;
      }

      /* 窄屏：侧栏可折叠 */
      @media (max-width: 720px) {
        .wm-side { width: 200px; flex-basis: 200px; }
        .wm-editor #mount, .wm-editor .ProseMirror { padding: 20px 16px 80px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
